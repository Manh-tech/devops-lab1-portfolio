# ============================================================
# DevOps Lab 1 — CI/CD Pipeline với GitHub Actions
# Tự động deploy website lên GitHub Pages mỗi khi push code
# ============================================================

name: Deploy to GitHub Pages

# Chạy khi push lên nhánh main
# Hoặc chạy thủ công từ tab Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cho phép GitHub Actions ghi dữ liệu vào repository
# Cần quyền này để push code sang branch gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy source code từ repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Kiểm tra file index.html
      - name: Validate HTML
        run: |
          echo "Checking index.html exists..."

          if [ -f "index.html" ]; then
            echo "index.html found!"
            echo "File size: $(wc -c < index.html) bytes"
          else
            echo "index.html NOT found!"
            exit 1
          fi

      # Bước 3: Deploy website lên branch gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "Auto-deploy from CI pipeline"
